name: Robô RPA Challenge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"   # toda segunda, 09:00 (Brasília)
  push:
    branches: [main]

jobs:
  testes-e-execucao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m playwright install --with-deps chromium
      - run: python robo.py
      - uses: actions/upload-artifact@v4
        with:
          name: resultado
          path: |
            saida/resultado.json
            saida/resultado.png
